[project]
name = "patera"
version = "0.120.0"
description = "A modular async-first python webframework"
readme = "README.md"
authors = [
    { name = "MarkoSterk", email = "marko_sterk@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "asgi-lifespan>=2.1.0",
    "granian>=2.7.2",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "idna>=3.11",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "mako>=1.3.10",
    "markupsafe>=3.0.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.25",
    "websockets>=16.0",
    "werkzeug>=3.1.6",
]

[project.optional-dependencies]
aiinterface = ["patera-aiinterface"]
apiinterface = ["patera-apiinterface"]
auth = ["patera-auth"]
caching = ["patera-caching"]
caching-redis = ["patera-caching[redis]"]
caching-sqlite = ["patera-caching[sqlite]"]
database = ["patera-database"]
migrate = ["patera-migrate"]
email = ["patera-email"]
taskmanager = ["patera-taskmanager"]
testing = ["anyio", "pytest", "pytest-cov", "pytest-asyncio", "asgi-lifespan", "httpx"]
dev = ["uvicorn", "watchfiles"]
admin = ["patera-admin"]
desktop = ["patera-desktop"]
all = [
    "patera-database",
    "patera-migrate",
    "patera-email",
    "patera-aiinterface",
    "patera-apiinterface",
    "patera-auth",
    "patera-caching",
    "patera-taskmanager",
    "patera-admin"
]

[tool.uv.workspace]
members = [
    "packages/patera-admin",
    "packages/patera-aiinterface",
    "packages/patera-apiinterface",
    "packages/patera-auth",
    "packages/patera-caching",
    "packages/patera-database",
    "packages/patera-migrate",
    "packages/patera-email",
    "packages/patera-taskmanager",
    "packages/patera-desktop"
]

[tool.uv.sources]
patera-admin = { workspace = true }
patera-aiinterface = { workspace = true }
patera-apiinterface = { workspace = true }
patera-auth = { workspace = true }
patera-database = { workspace = true }
patera-taskmanager = { workspace = true }
patera-email = { workspace = true }
patera-caching = { workspace = true }
patera-migrate = { workspace = true }
patera-desktop = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
patera = "patera.cli:main"

[project.urls]
Homepage = "https://github.com/MarkoSterk/Patera"
Issues = "https://github.com/MarkoSterk/Patera/issues"

[tool.pylint]
# Global Pylint configuration

[tool.pylint."messages control"]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:apscheduler.*",
]
markers = [
    "integration: tests that run a complete application through the ASGI interface",
]

[tool.coverage.run]
source = ["src/patera", "packages"]
omit = ["*/static/*", "*/templates/*"]

[tool.mypy]
disable_error_code = ["import-untyped"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.5",
    "uvicorn>=0.42.0",
    "watchfiles>=1.1.1",
    "anyio",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov",
    "fakeredis>=2.20",
]

[project]
name = "patera"
version = "0.123.4"
description = "Modular async-first Python web framework with controllers, dependency injection and typed configuration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marko Šterk", email = "marko_sterk@hotmail.com" }]
requires-python = ">=3.13"
keywords = [
    "asgi",
    "async",
    "web",
    "framework",
    "dependency injection",
    "rest",
    "api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "aiofiles>=25.1.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.25",
    "werkzeug>=3.1.6",
]

[project.optional-dependencies]
prod = ["granian>=2.7.2"]
dev = ["uvicorn>=0.42.0", "watchfiles>=1.1.1", "websockets>=16.0"]
testing = ["anyio", "pytest>=8", "pytest-cov", "pytest-asyncio>=0.24", "asgi-lifespan>=2.1.0", "httpx>=0.28.1"]
database = ["patera-database>=0.11"]
migrate = ["patera-migrate>=0.11"]
auth = ["patera-auth>=0.11"]
caching = ["patera-caching>=0.11"]
caching-redis = ["patera-caching[redis]>=0.11"]
caching-sqlite = ["patera-caching[sqlite]>=0.11"]
taskmanager = ["patera-taskmanager>=0.11"]
email = ["patera-email>=0.11"]
apiinterface = ["patera-apiinterface>=0.11"]
joltui = ["patera-joltui>=0.1"]
admin = ["patera-admin>=0.11"]
aiinterface = ["patera-aiinterface>=0.11"]
desktop = ["patera-desktop>=0.11"]
desktop-ui = ["patera-desktop-ui>=0.3"]
all = [
    "patera-joltui>=0.1",
    "patera-database>=0.11",
    "patera-migrate>=0.11",
    "patera-email>=0.11",
    "patera-apiinterface>=0.11",
    "patera-auth>=0.11",
    "patera-caching>=0.11",
    "patera-taskmanager>=0.11",
    "patera-admin>=0.11",
]

[tool.uv.workspace]
members = [
    "packages/patera-joltui",
    "packages/patera-admin",
    "packages/patera-aiinterface",
    "packages/patera-apiinterface",
    "packages/patera-auth",
    "packages/patera-caching",
    "packages/patera-database",
    "packages/patera-migrate",
    "packages/patera-email",
    "packages/patera-taskmanager",
    "packages/patera-desktop",
    "packages/patera-desktop-ui",
    "examples/quick_exams",
]

[tool.uv.sources]
patera-joltui = { workspace = true }
patera-admin = { workspace = true }
patera-aiinterface = { workspace = true }
patera-apiinterface = { workspace = true }
patera-auth = { workspace = true }
patera-database = { workspace = true }
patera-taskmanager = { workspace = true }
patera-email = { workspace = true }
patera-caching = { workspace = true }
patera-migrate = { workspace = true }
patera-desktop = { workspace = true }
patera-desktop-ui = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
patera = "patera.cli:main"

[project.urls]
Homepage = "https://github.com/MarkoSterk/Patera"
Documentation = "https://github.com/MarkoSterk/Patera#readme"
Repository = "https://github.com/MarkoSterk/Patera"
Issues = "https://github.com/MarkoSterk/Patera/issues"
Changelog = "https://github.com/MarkoSterk/Patera/blob/main/CHANGELOG.md"

[tool.pylint]
# Global Pylint configuration

[tool.pylint."messages control"]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:apscheduler.*",
]
markers = [
    "integration: tests that run a complete application through the ASGI interface",
]

[tool.coverage.run]
source = ["src/patera", "packages"]
omit = ["*/static/*", "*/templates/*"]

[tool.mypy]
disable_error_code = ["import-untyped"]
# Pyodide evaluates this asset with top-level await; check it separately.
exclude = ['packages/patera-desktop-ui/src/patera/desktop/ui/assets/bootstrap\.py$']

# Optional dependencies of the experimental packages (AI interface extras, Desktop).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pgvector.*", "sentence_transformers.*", "torch.*", "webview.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.5",
    "granian>=2.7.2",
    "uvicorn>=0.42.0",
    "watchfiles>=1.1.1",
    "anyio",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov",
    "fakeredis>=2.20",
    # AI interface document tests (SQLite always; PostgreSQL with PATERA_TEST_PG_URI)
    "numpy>=2.4.4",
    "pgvector>=0.4.2",
    "asyncpg>=0.30",
    "patera-desktop[pyinstaller]",
    "patera-desktop-ui",
]

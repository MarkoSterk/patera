# Zensical configuration for the Patera documentation.
#
#   Preview:  uvx --with mkdocstrings-python zensical serve         (http://localhost:8000)
#   Build:    uvx --with mkdocstrings-python zensical build --clean (output in site/)
#
# See docs/project/documentation.md for the versioned publishing workflow.

[project]
site_name = "Patera"
site_description = "Modular, async-first Python web framework with controllers, dependency injection and typed configuration."
site_author = "Marko Šterk"
site_url = "https://patera.markosterk.com/"
repo_url = "https://github.com/MarkoSterk/Patera"
repo_name = "MarkoSterk/Patera"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; Marko Šterk. Released under the MIT License."
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/index.md",
    "getting-started/installation.md",
    "getting-started/quickstart.md",
    "getting-started/project-layout.md",
    "getting-started/running.md",
  ] },
  { "Guide" = [
    "guide/index.md",
    { "Fundamentals" = [
      "guide/configuration.md",
      "guide/application.md",
      "guide/dependency-injection.md",
    ] },
    { "HTTP" = [
      "guide/controllers.md",
      "guide/requests.md",
      "guide/responses.md",
      "guide/exception-handling.md",
      "guide/middleware.md",
      "guide/cors.md",
      "guide/websockets.md",
    ] },
    { "Content" = [
      "guide/templates.md",
      "guide/static-files.md",
      "guide/openapi.md",
    ] },
    { "Operations" = [
      "guide/logging.md",
      "guide/cli.md",
      "guide/testing.md",
      "guide/coding-agents.md",
    ] },
    "guide/custom-extensions.md",
  ] },
  { "Extensions" = [
    "extensions/index.md",
    { "Data" = [
      "extensions/database.md",
      "extensions/migrations.md",
      "extensions/caching.md",
    ] },
    { "Security" = [
      "extensions/authentication.md",
      "extensions/admin.md",
    ] },
    { "Integrations" = [
      "extensions/taskmanager.md",
      "extensions/email.md",
      "extensions/apiinterface.md",
      "extensions/joltui.md",
    ] },
    { "Experimental" = [
      "extensions/aiinterface.md",
      "extensions/desktop.md",
      "extensions/desktop-ui/index.md",
      "extensions/desktop-ui/runtime.md",
    ] },
  ] },
  { "Deployment" = "deployment.md" },
  { "Reference" = [
    "reference/index.md",
    "reference/configuration.md",
    "reference/cli.md",
    "reference/public-api.md",
    { "Python API" = [
      "reference/api/patera.md",
      "reference/api/controller.md",
      "reference/api/exceptions.md",
      "reference/api/injectable.md",
      "reference/api/middleware.md",
      "reference/api/logging.md",
      "reference/api/cli.md",
      "reference/api/testing.md",
    ] },
  ] },
  { "Project" = [
    "project/changelog.md",
    "project/versioning.md",
    "project/contributing.md",
    "project/documentation.md",
    "project/license.md",
  ] },
]

[project.extra]
# Version selector. Filled by mike when versions are deployed
# (see docs/project/documentation.md).
version.provider = "mike"
version.default = "latest"
version.alias = true

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MarkoSterk/Patera"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/patera/"

[project.theme]
language = "en"
logo = "assets/patera_logo.png"
favicon = "assets/patera_logo.png"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# API reference generated from the source code with mkdocstrings.
# The extension packages live in their own src/ folders of the uv workspace.
[project.plugins.mkdocstrings.handlers.python]
paths = [
  "src",
  "packages/patera-admin/src",
  "packages/patera-aiinterface/src",
  "packages/patera-apiinterface/src",
  "packages/patera-auth/src",
  "packages/patera-caching/src",
  "packages/patera-database/src",
  "packages/patera-desktop/src",
  "packages/patera-desktop-ui/src",
  "packages/patera-email/src",
  "packages/patera-joltui/src",
  "packages/patera-migrate/src",
  "packages/patera-taskmanager/src",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
show_source = false
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true
members_order = "source"
filters = ["!^_"]
merge_init_into_class = true

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

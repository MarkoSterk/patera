[project]
name = "patera-database"
version = "0.13.3"
description = "Async SQLAlchemy integration for Patera: databases, request sessions, repositories and transactions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marko Šterk", email = "marko_sterk@hotmail.com" }]
requires-python = ">=3.13"
keywords = [
    "patera",
    "sqlalchemy",
    "database",
    "orm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Database",
]
dependencies = [
    "patera>=0.121",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]

[project.urls]
Homepage = "https://github.com/MarkoSterk/Patera"
Documentation = "https://github.com/MarkoSterk/Patera#readme"
Repository = "https://github.com/MarkoSterk/Patera"
Issues = "https://github.com/MarkoSterk/Patera/issues"
Changelog = "https://github.com/MarkoSterk/Patera/blob/main/CHANGELOG.md"

[tool.uv.sources]
patera = { workspace = true }

[tool.uv.build-backend]
module-name = "patera.database"

[build-system]
requires = ["uv_build>=0.10.9,<0.13.0"]
build-backend = "uv_build"

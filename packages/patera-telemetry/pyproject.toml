[project]
name = "patera-telemetry"
version = "0.1.0"
description = "OpenTelemetry tracing, metrics and log correlation for Patera"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marko Šterk", email = "marko_sterk@hotmail.com" }]
requires-python = ">=3.13"
keywords = [
    "patera",
    "opentelemetry",
    "tracing",
    "metrics",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
    "Topic :: System :: Monitoring",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "opentelemetry-api>=1.39",
    "patera>=0.125.2",
]

[project.optional-dependencies]
sdk = [
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.39",
]
grpc = [
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39",
]
sqlalchemy = ["opentelemetry-instrumentation-sqlalchemy>=0.60b0"]
httpx = ["opentelemetry-instrumentation-httpx>=0.60b0"]
redis = ["opentelemetry-instrumentation-redis>=0.60b0"]
all = [
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.39",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b0",
    "opentelemetry-instrumentation-httpx>=0.60b0",
    "opentelemetry-instrumentation-redis>=0.60b0",
]

[project.urls]
Homepage = "https://github.com/MarkoSterk/Patera"
Documentation = "https://github.com/MarkoSterk/Patera#readme"
Repository = "https://github.com/MarkoSterk/Patera"
Issues = "https://github.com/MarkoSterk/Patera/issues"
Changelog = "https://github.com/MarkoSterk/Patera/blob/main/CHANGELOG.md"

[tool.uv.sources]
patera = { workspace = true }

[tool.uv.build-backend]
module-name = "patera.telemetry"

[build-system]
requires = ["uv_build>=0.10.9,<0.13.0"]
build-backend = "uv_build"

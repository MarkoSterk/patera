[project]
name = "patera-auth"
version = "0.6.0"
requires-python = ">=3.13"
dependencies = [
  "bcrypt>=5.0.0",
  "cryptography>=46.0.5",
  "patera",
  "pyjwt>=2.12.1",
]

[tool.uv.sources]
patera = { workspace = true }

[tool.uv.build-backend]
module-name = "patera.auth"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

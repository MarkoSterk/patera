<dialog class="admin-dialog" id="delete-record-dialog">
  <div class="card border-0 shadow-lg">

    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <h2 class="h5 mb-0">
        <i class="bi bi-trash3 me-1 text-danger"></i>
        {{ translate('delete_record') }}
      </h2>

      <button
        type="button"
        class="btn-close"
        id="close-delete-record-dialog"
        aria-label="{{ translate('close') }}"
      ></button>
    </div>

    <div class="card-body">
      <div
        id="delete-record-error"
        class="alert alert-danger d-none"
        role="alert"
      ></div>

      <p class="mb-2">
        {{ translate('confirm_delete_record') }}
      </p>

      <p class="text-muted small mb-0">
        {{ translate('action_cannot_be_undone') }}
      </p>
    </div>

    <div class="card-footer bg-white d-flex justify-content-end gap-2">
      <button
        type="button"
        class="btn btn-outline-secondary"
        id="cancel-delete-record-dialog"
      >
        {{ translate('cancel') }}
      </button>

      <button
        type="button"
        class="btn btn-danger"
        id="confirm-delete-record-btn"
      >
        <i class="bi bi-trash3 me-1"></i>
        {{ translate('delete') }}
      </button>
    </div>

  </div>
</dialog>

<dialog class="admin-dialog" id="view-record-dialog">
  <div class="card border-0 shadow-lg">

    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <h2 class="h5 mb-0">
        <i class="bi bi-eye me-1"></i>
        View {{ model_name }}
      </h2>

      <button
        type="button"
        class="btn-close"
        id="close-view-record-dialog"
        aria-label="Close"
      ></button>
    </div>

    <div class="card-body">

      <div
        id="view-record-error"
        class="alert alert-danger d-none"
        role="alert"
      ></div>

      <div
        id="view-record-loading"
        class="text-center text-muted py-4 d-none"
      >
        <div class="spinner-border spinner-border-sm me-2" aria-hidden="true"></div>
        Loading record...
      </div>

      <div id="view-record-content" class="table-responsive">
        <table class="table table-sm table-hover align-middle mb-0">
          <tbody id="view-record-table-body">
          </tbody>
        </table>
      </div>

    </div>

    <div class="card-footer bg-white d-flex justify-content-end">
      <button
        type="button"
        class="btn btn-outline-secondary"
        id="close-view-record-footer-btn"
      >
        Close
      </button>
    </div>

  </div>
</dialog>

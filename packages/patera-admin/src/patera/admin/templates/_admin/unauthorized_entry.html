<!doctype html>
<html lang="{{ lang or 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ translate('unauthorized') if translate else 'Unauthorized' }}</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  >

  <style>
    body {
      min-height: 100vh;
      background: #f8f9fa;
    }

    .auth-error-card {
      width: 100%;
      max-width: 560px;
    }

    .auth-error-icon {
      width: 80px;
      height: 80px;
    }

    .auth-error-logo {
      width: 120px;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto 1.25rem;
    }
  </style>
</head>
<body>

  <main class="min-vh-100 d-flex align-items-center justify-content-center px-3">
    <div class="auth-error-card card shadow-sm border-0">
      <div class="card-body p-4 p-md-5 text-center">

        {% if logo_url %}
          <img
            src="{{ logo_url }}"
            alt="{{ translate('logo') if translate else 'Logo' }}"
            class="auth-error-logo"
          >
        {% endif %}

        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-warning-subtle text-warning auth-error-icon mb-4">
          <i class="bi bi-shield-lock fs-1"></i>
        </div>

        <h1 class="h3 mb-2">
          {{ translate('access_denied') }}
        </h1>

        <p class="text-muted mb-4">
          {{ translate('unauthorized_message') }}
        </p>

        <div class="alert alert-warning text-start mb-4" role="alert">
          <div class="d-flex gap-2">
            <div>
              <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <div>
              <strong>
                {{ translate('insufficient_permissions') }}
              </strong>
              <div class="small mt-1">
                {{ translate('contact_admin_for_access') }}
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
            <a
                href="{{ admin_interface.url_for('_AdminController.login') }}"
                class="btn btn-outline-secondary"
            >
                <i class="bi bi-box-arrow-in-right me-1"></i>
                {{ translate('login_as_different_user') }}
            </a>
        </div>

      </div>
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>

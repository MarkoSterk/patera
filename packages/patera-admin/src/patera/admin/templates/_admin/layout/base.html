<!doctype html>
<html lang="{{ lang or 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ translate('dashboard') }}</title>

  <script>
    window._translations_object = {{ translation_map|tojson }};
    window._translations_map = new Map(Object.entries(window._translations_object));

    window.translate = function translate(key) {
      if (!window._translations_map || !window._translations_map.has(key)) {
        return key;
      }

      return window._translations_map.get(key);
    };
  </script>

  <link
    href="{{ admin_interface.url_for('_AdminController.static', filename='js/vendors/bootstrap/bootstrap.min.css') }}"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="{{ admin_interface.url_for('_AdminController.static', filename='js/vendors/bootstrap/bootstrap-icons.min.css') }}"
  >

  <script src="{{ admin_interface.url_for('_AdminController.static', filename='js/vendors/jquery/jquery.slim.min.js') }}"></script>

  <link href="{{ admin_interface.url_for('_AdminController.static', filename='js/vendors/summernote/summernote-lite.min.css') }}" rel="stylesheet">
  <script src="{{ admin_interface.url_for('_AdminController.static', filename='js/vendors/summernote/summernote-lite.min.js') }}"></script>

  <script type="module" src="{{ admin_interface.url_for('_AdminController.static', filename='js/file_explorer/file_explorer.js') }}"></script>
  <script type="module" src="{{ admin_interface.url_for('_AdminController.static', filename='js/inputs/index.js') }}"></script>

  <style>
    body {
      min-height: 100vh;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      background: #ffffff;
    }

    .app-main {
      flex: 1;
    }

    .navbar-brand img {
      height: 36px;
      width: auto;
      max-width: 120px;
      object-fit: contain;
      display: block;
      margin: 0;
    }

    .content-card {
      border: 0;
    }

    .log-level {
      min-width: 72px;
    }

    .log-meta {
      white-space: nowrap;
    }

    .log-message {
      min-width: 360px;
      max-width: 700px;
      white-space: normal;
      word-break: break-word;
    }

    .app-footer {
      background: #ffffff;
      color: #6c757d;
      border-top: 1px solid #dee2e6;
    }

    summernote-editor {
      display: block;
    }

    summernote-editor .note-editor {
      width: 100%;
    }

    summernote-editor .note-editable {
      min-height: 160px;
    }

    file-explorer {
      display: block;
    }

    .file-explorer-drop-zone {
      min-height: 360px;
      transition: background 0.15s ease, outline 0.15s ease;
    }

    .file-explorer-drop-zone.file-explorer-drag-over {
      background: rgba(13, 110, 253, 0.08);
      outline: 2px dashed #0d6efd;
      outline-offset: -0.75rem;
    }

    .file-explorer-items {
      min-height: 240px;
    }

    .file-explorer-item-element {
      display: block;
    }

    .file-explorer-item-button {
      width: 96px;
      min-height: 108px;
      border: 1px solid transparent;
      border-radius: 0.375rem;
      background: transparent;
      padding: 0.5rem 0.35rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      cursor: default;
      user-select: none;
      color: inherit;
    }

    .file-explorer-item-button:hover {
      background: rgba(13, 110, 253, 0.06);
      border-color: rgba(13, 110, 253, 0.15);
    }

    .file-explorer-item-button.selected {
      background: rgba(13, 110, 253, 0.14);
      border-color: rgba(13, 110, 253, 0.45);
    }

    .file-explorer-item-button.drop-target {
      background: rgba(25, 135, 84, 0.12);
      border-color: rgba(25, 135, 84, 0.55);
      outline: 2px dashed rgba(25, 135, 84, 0.65);
      outline-offset: 2px;
    }

    .file-explorer-item-button.dragging {
      opacity: 0.55;
    }

    .file-explorer-item-icon-wrap {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .file-explorer-item-icon {
      font-size: 2.15rem;
      line-height: 1;
    }

    .file-explorer-item-name {
      max-width: 88px;
      font-size: 0.82rem;
      line-height: 1.15;
      margin-top: 0.25rem;
    }

    .file-explorer-item-meta {
      max-width: 88px;
      font-size: 0.68rem;
      line-height: 1.1;
      margin-top: 0.15rem;
    }
  </style>
  {% block css %}
  {% endblock %}
</head>
<body>
    {% include '_admin/layout/menu.html' %}

    {% block content %}

    {% endblock %}

    {% include '_admin/layout/footer.html' %}

  <script
    src="{{ admin_interface.url_for('_AdminController.static', filename='js/vendors/bootstrap/bootstrap.bundle.min.js') }}">
  </script>

  <script>
    const logoutBtn = document.getElementById('logout-btn');
    const logoutUrl = logoutBtn.getAttribute("data-logout-url");
    const loginUrl = logoutBtn.getAttribute("data-login-url");
    logoutBtn.addEventListener("click", async (e) => {
        let response = await fetch(logoutUrl);
        if(response.ok){
            location.href = loginUrl;
        }
    })
  </script>

  {% block js %}

  {% endblock %}
</body>
</html>

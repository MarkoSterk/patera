<!doctype html>
<html lang="{{ lang or 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ translate('dashboard') }}</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  >

  <style>
    body {
      min-height: 100vh;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      background: #ffffff;
    }

    .app-main {
      flex: 1;
    }

    .navbar-brand img {
      height: 36px;
      width: auto;
      max-width: 120px;
      object-fit: contain;
      display: block;
      margin: 0;
    }

    .content-card {
      border: 0;
    }

    .log-level {
      min-width: 72px;
    }

    .log-meta {
      white-space: nowrap;
    }

    .log-message {
      min-width: 360px;
      max-width: 700px;
      white-space: normal;
      word-break: break-word;
    }

    .app-footer {
      background: #ffffff;
      color: #6c757d;
      border-top: 1px solid #dee2e6;
    }
  </style>
  {% block css %}
  {% endblock %}
</head>
<body>

    {% include '_admin/layout/menu.html' %}

    {% block content %}

    {% endblock %}

    {% include '_admin/layout/footer.html' %}

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

  <script>
    const logoutBtn = document.getElementById('logout-btn');
    const logoutUrl = logoutBtn.getAttribute("data-logout-url");
    const loginUrl = logoutBtn.getAttribute("data-login-url");

    logoutBtn.addEventListener("click", async (e) => {
        let response = await fetch(logoutUrl);
        if(response.ok){
            location.href = loginUrl;
        }
    })
  </script>

  {% block js %}

  {% endblock %}
</body>
</html>

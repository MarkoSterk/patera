{% extends '_admin/layout/base.html' %}

{% block content %}
<main class="app-main py-4">
  <div class="container-fluid px-3 px-md-4">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
      <div>
        <h1 class="h3 mb-1">
          <i class="bi bi-envelope-paper me-1"></i>
          Send Email
        </h1>

        <p class="text-muted mb-0">
          Compose and send an email message with an optional file attachment.
        </p>
      </div>

      <div class="mt-3 mt-md-0">
        <a
          href="{{ admin_interface.url_for('_AdminController.dashboard') }}"
          class="btn btn-outline-secondary"
        >
          <i class="bi bi-arrow-left me-1"></i>
          Back to Dashboard
        </a>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-xl-8">

        <div class="card content-card shadow-sm">
          <div class="card-header bg-white">
            <h2 class="h5 mb-0">
              <i class="bi bi-pencil-square me-1"></i>
              Email Message
            </h2>
          </div>

          <div class="card-body p-4">
            <form
              id="email-form"
              method="post"
              action="#"
              enctype="multipart/form-data"
            >

              <div
                id="email-error-container"
                class="alert alert-danger d-none"
                role="alert"
              ></div>

              <div
                id="email-success-container"
                class="alert alert-success d-none"
                role="alert"
              ></div>

              <div class="mb-3">
                <label for="sender-email" class="form-label">
                  Sender Email
                  <span class="text-danger">*</span>
                </label>

                <div class="input-group">
                  <span class="input-group-text">
                    <i class="bi bi-person-badge"></i>
                  </span>

                  <select
                    id="sender-email"
                    name="sender_email"
                    class="form-select"
                    required
                  >
                    <option value="">Select sender email</option>

                    {% for sender_email in sender_emails %}
                      <option value="{{ sender_email }}">
                        {{ sender_email }}
                      </option>
                    {% else %}
                      <option value="" disabled>
                        No sender emails available
                      </option>
                    {% endfor %}
                  </select>
                </div>
              </div>

              <div class="mb-3">
                <label for="email-subject" class="form-label">
                  Subject
                  <span class="text-danger">*</span>
                </label>

                <div class="input-group">
                  <span class="input-group-text">
                    <i class="bi bi-type"></i>
                  </span>

                  <input
                    type="text"
                    id="email-subject"
                    name="subject"
                    class="form-control"
                    placeholder="Enter email subject"
                    required
                  >
                </div>
              </div>

              <div class="mb-3">
                <label for="email-attachment" class="form-label">
                  Attachment
                </label>

                <div class="input-group">
                  <span class="input-group-text">
                    <i class="bi bi-paperclip"></i>
                  </span>

                  <input
                    type="file"
                    id="email-attachment"
                    name="attachment"
                    class="form-control"
                  >
                </div>

                <div class="form-text">
                  Optional file attachment.
                </div>
              </div>

              <div class="mb-4">
                <label for="email-message" class="form-label">
                  Message
                  <span class="text-danger">*</span>
                </label>

                <textarea
                  id="email-message"
                  name="message"
                  class="form-control"
                  rows="10"
                  placeholder="Write your email message here..."
                  required
                ></textarea>
              </div>

              <div class="d-flex justify-content-end gap-2">
                <button
                  type="reset"
                  class="btn btn-outline-secondary"
                >
                  <i class="bi bi-x-circle me-1"></i>
                  Clear
                </button>

                <button
                  type="submit"
                  class="btn btn-primary"
                >
                  <i class="bi bi-send me-1"></i>
                  Send Email
                </button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>

  </div>
</main>
{% endblock %}
